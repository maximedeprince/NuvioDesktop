name: Desktop Test Build (Windows, no secrets)

# Fork-friendly build of the Windows MSI for local testing.
# Mirrors the Windows job of desktop-release.yml but drops the secret gate
# (LOCAL_PROPERTIES_BASE64 / Sentry) so it runs on a fork. Backend keys
# (Supabase/Trakt) fall back to their build defaults; the Discord client id
# has a hardcoded default, so Discord Rich Presence still works.
#
# Runs automatically on every push to this branch, and can be re-run from the
# Actions tab. To rebuild after changes, merge/rebase them onto this branch
# and push (or use "Re-run all jobs" on a previous run).

on:
  push:
    branches: [ci/desktop-test-build-v2]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64 (test)
    runs-on: windows-2022
    env:
      WEBVIEW2_VERSION: 1.0.4078.44
      TORRSERVER_WINDOWS_SHA256: 13031185a54abe0f729f9f3bdb7271a349a89ac8c559327d773c66007ed604f4

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Fetch Windows runtime
        shell: bash
        run: |
          git lfs pull --include="composeApp/src/desktopMain/native/windows/runtime/**,composeApp/src/desktopMain/resources/torrserver/windows-amd64/TorrServer.exe" --exclude=""
          runtime_path="composeApp/src/desktopMain/native/windows/runtime/libmpv-2.dll"
          if [[ ! -f "${runtime_path}" ]]; then
            echo "The bundled Windows libmpv runtime is missing." >&2
            exit 1
          fi
          runtime_size="$(wc -c < "${runtime_path}")"
          if (( runtime_size < 1000000 )); then
            echo "The bundled Windows libmpv runtime was not materialized from Git LFS." >&2
            exit 1
          fi
          torrserver_path="composeApp/src/desktopMain/resources/torrserver/windows-amd64/TorrServer.exe"
          if [[ ! -f "${torrserver_path}" ]]; then
            echo "The bundled Windows TorrServer executable is missing." >&2
            exit 1
          fi
          torrserver_sha256="$(sha256sum "${torrserver_path}" | awk '{print $1}')"
          if [[ "${torrserver_sha256}" != "${TORRSERVER_WINDOWS_SHA256}" ]]; then
            echo "The bundled Windows TorrServer executable checksum does not match." >&2
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare local.properties
        shell: bash
        run: |
          # generateRuntimeConfigs declares local.properties as a required input file,
          # so Gradle fails validation if it is missing. The build itself falls back to
          # defaults for every value; the Discord client id has a hardcoded default so
          # Rich Presence works. Backend keys are placeholders (login/sync won't work,
          # which is fine for testing the Discord presence).
          cat > local.properties <<'EOF'
          NUVIO_DISCORD_CLIENT_ID=1538974392376369212
          NUVIO_SUPABASE_URL=https://placeholder.supabase.co
          NUVIO_SUPABASE_ANON_KEY=placeholder
          TRAKT_CLIENT_ID=placeholder
          TRAKT_CLIENT_SECRET=placeholder
          EOF

      - name: Install WebView2 SDK
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 `
            -Version $env:WEBVIEW2_VERSION `
            -OutputDirectory "$env:RUNNER_TEMP\nuget" `
            -DirectDownload `
            -NonInteractive `
            -NoCache

          $webView2Root = Join-Path $env:RUNNER_TEMP "nuget\Microsoft.Web.WebView2.$env:WEBVIEW2_VERSION"
          $loaderLibrary = Join-Path $webView2Root "build\native\x64\WebView2Loader.dll.lib"
          if (-not (Test-Path $loaderLibrary)) {
            throw "WebView2Loader.dll.lib was not found at $loaderLibrary"
          }
          "WEBVIEW2_ROOT=$webView2Root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build MSI
        shell: pwsh
        run: |
          & .\gradlew.bat `
            :composeApp:packageReleaseMsi `
            "-Pnuvio.webview2.dir=$env:WEBVIEW2_ROOT" `
            "-Pcompose.desktop.packaging.checkJdkVendor=false" `
            --no-configuration-cache `
            --no-daemon `
            --stacktrace

      - name: Upload MSI
        uses: actions/upload-artifact@v7
        with:
          name: nuvio-desktop-windows-x64-discord-test
          path: composeApp/build/compose/release-msis/*.msi
          if-no-files-found: error
